spring.application.name=demo-test
rate-limiter.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Actuator & Prometheus Configuration for Tests
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

jwt.secret=GAPGPTMASKTOKENwtiqz0d61zfX0X
jwt.expiration=86400000
# Resilience4j Circuit Breaker Test Configuration
resilience4j.circuitbreaker.instances.euroFxClient.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.euroFxClient.sliding-window-size=5
resilience4j.circuitbreaker.instances.euroFxClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.euroFxClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.euroFxClient.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.euroFxClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.euroFxClient.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.euroFxClient.register-health-indicator=true
