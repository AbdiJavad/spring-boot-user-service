# ==========================================
# Database Configuration (PostgresSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:GAPGPTMASKTOKEInjure48ts49yjX0X}   
                                                                                                                                                                                                                                                                                                          # نکته کلیدی: driver-class-name را کاملاً حذف کردیم تا Spring خودش بر اساس URL، درایور Postgres را هوشمندانه تشخیص دهد.
# ==========================================
# JPA & Hibernate Settings
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgresSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
