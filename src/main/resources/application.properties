spring.application.name=demo
server.port=9090

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/demo_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Security JWT
application.security.jwt.secret-key=GAPGPTMASKTOKENk1ie4j6na6X0X
application.security.jwt.expiration=86400000
app.security.refresh-token-validity-seconds=604800

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG

# Schema initialization
spring.sql.init.mode=never

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name:demo-service}
management.endpoint.prometheus.enabled=true

# Resilience4j Circuit Breaker Configuration (Enterprise German Standard)
resilience4j.circuitbreaker.instances.euroFxClient.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.euroFxClient.sliding-window-size=5
resilience4j.circuitbreaker.instances.euroFxClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.euroFxClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.euroFxClient.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.euroFxClient.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.euroFxClient.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.euroFxClient.register-health-indicator=true

# Flyway & Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Management / Actuator Endpoints & Tracing
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Redis Settings
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# Logging formatting
logging.config=classpath:logback-spring.xml\n