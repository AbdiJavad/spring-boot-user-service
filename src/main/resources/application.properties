spring.application.name=demo

# Database Configuration for PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/user_service_db}}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Security JWT Configuration (256-bit Secure Base64 Key)
application.security.jwt.secret-key=GAPGPTMASKTOKEN355jhyjkimlX0X
application.security.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG
app.security.refresh-token-validity-seconds=604800

# Schema initialization
spring.sql.init.mode=never

# Actuator & Observability Configurations
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
